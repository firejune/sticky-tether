<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sticky-tether — Interactive Demo</title>
    <style>
      :root {
        --header-height: 56px;
        --bg: #0f1115;
        --surface: #171a21;
        --border: rgba(255, 255, 255, 0.1);
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: rgba(15, 17, 21, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      header strong {
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .badge {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(88, 166, 255, 0.14);
        color: var(--accent);
      }
      .layout {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 24px 120px;
        display: flex;
        align-items: flex-start;
        gap: 48px;
      }
      main {
        flex: 1 1 0%;
        min-width: 0;
      }
      section {
        padding: 28px 32px;
        margin-bottom: 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        min-height: 360px;
      }
      section h2 {
        margin-top: 0;
        font-size: 22px;
      }
      aside {
        flex: 0 0 250px;
        width: 250px;
        position: sticky;
        top: 86px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }
      .toc-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid var(--border);
      }
      .toc-item {
        display: block;
        padding: 8px 12px;
        margin-left: -1px;
        border-left: 2px solid transparent;
        color: var(--muted);
        text-decoration: none;
        font-size: 13.5px;
        transition: color 140ms ease, border-color 140ms ease;
      }
      .toc-item:hover {
        color: var(--text);
      }
      .toc-item[aria-current='location'] {
        color: var(--accent);
        border-left-color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>sticky-tether</strong>
      <span class="badge">Bi-directional Tether + Active Item Guard</span>
    </header>
    <div class="layout">
      <main id="article"></main>
      <aside id="tether-aside">
        <div class="toc-title">On this page (24 sections)</div>
        <ol class="toc-list" id="toc"></ol>
      </aside>
    </div>

    <script type="module">
      import { createStickyTether } from '../dist/core.js'

      const article = document.getElementById('article')
      const toc = document.getElementById('toc')
      const aside = document.getElementById('tether-aside')

      const sections = Array.from({ length: 24 }, (_, i) => ({
        id: `section-${i + 1}`,
        title: `${i + 1}. Section Overview & Architecture #${i + 1}`
      }))

      for (const s of sections) {
        const sec = document.createElement('section')
        sec.id = s.id
        sec.innerHTML = `<h2>${s.title}</h2><p>Scroll down and up — notice the sidebar has <strong>no internal scrollbar</strong>, tracks your scroll direction immediately, and never lets the active TOC item escape the viewport.</p>`
        article.appendChild(sec)

        const li = document.createElement('li')
        const a = document.createElement('a')
        a.className = 'toc-item'
        a.href = `#${s.id}`
        a.textContent = s.title
        a.dataset.id = s.id
        li.appendChild(a)
        toc.appendChild(li)
      }

      const links = Array.from(toc.querySelectorAll('.toc-item'))
      const headings = sections.map((s) => document.getElementById(s.id))

      const updateActive = () => {
        let activeId = sections[0].id
        for (const h of headings) {
          if (h.getBoundingClientRect().top <= 140) {
            activeId = h.id
          }
        }
        for (const link of links) {
          if (link.dataset.id === activeId) {
            link.setAttribute('aria-current', 'location')
          } else {
            link.removeAttribute('aria-current')
          }
        }
      }

      window.addEventListener('scroll', updateActive, { passive: true })
      updateActive()

      createStickyTether(aside, {
        topPadding: 30,
        bottomPadding: 24
      })
    </script>
  </body>
</html>
