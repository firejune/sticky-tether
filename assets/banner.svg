<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background dark obsidian slate gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d121d"/>
      <stop offset="55%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Left Viewport Rail (Muted Slate) -->
    <linearGradient id="rail-left" gradientUnits="userSpaceOnUse" x1="168" y1="136" x2="168" y2="376">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Right Sticky Clamped Rail (Slate to Cyan) -->
    <linearGradient id="rail-right" gradientUnits="userSpaceOnUse" x1="344" y1="136" x2="344" y2="376">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Single Elastic S-Curve Tether -->
    <linearGradient id="tether-line" gradientUnits="userSpaceOnUse" x1="168" y1="196" x2="344" y2="316">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Active Clamp Node Ring & Typography Accent -->
    <linearGradient id="cyan-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Joint Void Fill -->
    <linearGradient id="joint-void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>

    <!-- Typography White/Silver Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="bridge-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.82"/>
    </filter>

    <!-- Soft Ambient Backlight -->
    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Clean dark container with subtle border -->
  <rect width="880" height="240" rx="20" fill="url(#banner-bg)" stroke="#1a2234" stroke-width="1.5" />

  <!-- Subtle Cyan Glow behind Emblem -->
  <circle cx="144" cy="122" r="62" fill="#0EA5E9" opacity="0.10" filter="url(#ambient-blur)" />

  <!-- Left Minimal Sticky Tether Emblem -->
  <g transform="translate(34, 12) scale(0.42)">
    <g filter="url(#bridge-depth)">
      <line x1="168.0" y1="136.0" x2="168.0" y2="376.0" stroke="url(#rail-left)" stroke-width="32" stroke-linecap="round" />
      <line x1="344.0" y1="136.0" x2="344.0" y2="376.0" stroke="url(#rail-right)" stroke-width="32" stroke-linecap="round" />
    </g>

    <g filter="url(#bridge-depth)">
      <path d="M 168.0 196.0 C 256.0 196.0, 256.0 316.0, 344.0 316.0" fill="none" stroke="url(#tether-line)" stroke-width="28" stroke-linecap="round" />
    </g>

    <g filter="url(#bridge-depth)">
      <circle cx="168.0" cy="196.0" r="38" fill="#E2E8F0" />
      <circle cx="168.0" cy="196.0" r="15.5" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="168.0" cy="196.0" r="5.5" fill="#94A3B8" />

      <circle cx="344.0" cy="316.0" r="44" fill="url(#cyan-node)" />
      <circle cx="344.0" cy="316.0" r="18" fill="url(#joint-void)" stroke="#090b12" stroke-width="2.5" />
      <circle cx="344.0" cy="316.0" r="7.5" fill="#F8FAFC" />
    </g>
  </g>

  <!-- Typography & Feature Badges -->
  <g transform="translate(262, 0)">
    <!-- Main Title -->
    <text x="0" y="103" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      <tspan fill="url(#text-grad)">Sticky </tspan><tspan fill="url(#cyan-node)">Tether</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="143" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Bi-directional sticky scroll tethering with active-item viewport guard
    </text>

    <!-- Clean Restrained Feature Badges -->
    <g transform="translate(2, 168)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#111726" stroke="#1e293b" stroke-width="1" />
      <text x="80" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.3">ZERO DOUBLE-SCROLL</text>

      <!-- Badge 2 -->
      <rect x="168" y="0" width="174" height="26" rx="6" fill="#111726" stroke="#1e293b" stroke-width="1" />
      <text x="255" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="0.3">ACTIVE VIEWPORT GUARD</text>

      <!-- Badge 3 -->
      <rect x="350" y="0" width="168" height="26" rx="6" fill="#111726" stroke="#1e293b" stroke-width="1" />
      <text x="434" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="0.3">CORE &amp; REACT · 0 DEPS</text>
    </g>
  </g>
</svg>
