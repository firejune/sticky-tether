<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background dark obsidian gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1b"/>
      <stop offset="50%" stop-color="#070912"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Tri-Agent Spectrum for Glow & Typography -->
    <linearGradient id="tri-spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="28%" stop-color="#FF9F0A"/>
      <stop offset="55%" stop-color="#30D158"/>
      <stop offset="80%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>

    <!-- Left Viewport Scroll Rail -->
    <linearGradient id="rail-viewport" gradientUnits="userSpaceOnUse" x1="152" y1="132" x2="152" y2="380">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="50%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>

    <!-- Right Sticky Clamped Rail -->
    <linearGradient id="rail-sticky" gradientUnits="userSpaceOnUse" x1="360" y1="132" x2="360" y2="380">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="50%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <!-- Primary Elastic Tether Curve -->
    <linearGradient id="tether-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Upper Clamp Suspension Curve -->
    <linearGradient id="tether-upper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>

    <!-- Lower Clamp Suspension Curve -->
    <linearGradient id="tether-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#651FFF"/>
      <stop offset="50%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <!-- Active Item Core Ring Gradient -->
    <linearGradient id="broker-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>

    <!-- Joint Void Fill -->
    <linearGradient id="joint-void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="bridge-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.82"/>
    </filter>

    <!-- Soft Ambient Backlight -->
    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Clean dark container with subtle border -->
  <rect width="880" height="240" rx="20" fill="url(#banner-bg)" stroke="#1a202c" stroke-width="1.5" />

  <!-- Ambient Spectrum Glow behind Emblem -->
  <circle cx="142" cy="122" r="66" fill="url(#tri-spectrum)" opacity="0.14" filter="url(#ambient-blur)" />

  <!-- Left Sticky Tether Mechanical Emblem -->
  <g transform="translate(34, 12) scale(0.42)">
    <g filter="url(#bridge-depth)">
      <path d="M 152.0 192.0 C 232.0 192.0, 276.0 132.0, 360.0 132.0" fill="none" stroke="url(#tether-upper)" stroke-width="24" stroke-linecap="round" />
      <path d="M 152.0 336.0 C 232.0 336.0, 276.0 380.0, 360.0 380.0" fill="none" stroke="url(#tether-lower)" stroke-width="24" stroke-linecap="round" />
      <path d="M 152.0 336.0 C 236.0 336.0, 268.0 256.0, 360.0 256.0" fill="none" stroke="url(#tether-lower)" stroke-width="22" stroke-linecap="round" opacity="0.85" />
    </g>

    <g filter="url(#bridge-depth)">
      <line x1="152.0" y1="132.0" x2="152.0" y2="380.0" stroke="url(#rail-viewport)" stroke-width="34" stroke-linecap="round" />
      <line x1="360.0" y1="132.0" x2="360.0" y2="380.0" stroke="url(#rail-sticky)" stroke-width="34" stroke-linecap="round" />
    </g>

    <g filter="url(#bridge-depth)">
      <path d="M 152.0 192.0 C 256.0 192.0, 256.0 256.0, 360.0 256.0" fill="none" stroke="url(#tether-primary)" stroke-width="32" stroke-linecap="round" />
    </g>

    <g filter="url(#bridge-depth)">
      <circle cx="360.0" cy="132.0" r="36" fill="#A855F7" />
      <circle cx="360.0" cy="132.0" r="14.5" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="360.0" cy="132.0" r="5.5" fill="#38BDF8" />

      <circle cx="360.0" cy="380.0" r="36" fill="#30D158" />
      <circle cx="360.0" cy="380.0" r="14.5" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="360.0" cy="380.0" r="5.5" fill="#00C7BE" />

      <circle cx="152.0" cy="336.0" r="34" fill="#651FFF" />
      <circle cx="152.0" cy="336.0" r="13.5" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="152.0" cy="336.0" r="5" fill="#38BDF8" />

      <circle cx="152.0" cy="192.0" r="42" fill="#FF6B4A" />
      <circle cx="152.0" cy="192.0" r="17" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="152.0" cy="192.0" r="6.5" fill="#FF9F0A" />

      <circle cx="360.0" cy="256.0" r="50" fill="url(#broker-ring)" />
      <circle cx="360.0" cy="256.0" r="21" fill="url(#joint-void)" stroke="#090b12" stroke-width="2.5" />
      <circle cx="360.0" cy="256.0" r="8.5" fill="#F8FAFC" />
    </g>
  </g>

  <!-- Typography & Feature Badges -->
  <g transform="translate(262, 0)">
    <!-- Main Title -->
    <text x="0" y="103" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      <tspan fill="url(#text-grad)">Sticky </tspan><tspan fill="url(#tri-spectrum)">Tether</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="143" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Bi-directional sticky scroll tethering with active-item viewport guard
    </text>

    <!-- Clean Feature Badges -->
    <g transform="translate(2, 168)">
      <!-- Badge 1: Zero Double-Scroll -->
      <rect x="0" y="0" width="164" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="82" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">⚡ ZERO DOUBLE-SCROLL</text>

      <!-- Badge 2: Active Viewport Guard -->
      <rect x="172" y="0" width="178" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="261" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#30D158" text-anchor="middle">🎯 ACTIVE VIEWPORT GUARD</text>

      <!-- Badge 3: Core & React Zero-Dep -->
      <rect x="358" y="0" width="172" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="444" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">🛡️ CORE &amp; REACT · 0 DEPS</text>
    </g>
  </g>
</svg>
