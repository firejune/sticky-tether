name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: 'Existing tag to re-publish after a publish-side failure (e.g. v0.1.0). Leave empty normally.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        with:
          ref: ${{ inputs.republish }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        with:
          node-version: 22

      - name: Use an npm that speaks OIDC
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        run: npm ci

      - name: Build package
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        run: npm run build

      - name: Publish sticky-tether to npm
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.republish != '' }}
        run: npm publish --provenance --access public
