<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1612"/>
      <stop offset="50%" stop-color="#080b0c"/>
      <stop offset="100%" stop-color="#180910"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34f5c5"/>
      <stop offset="100%" stop-color="#00b884"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5c77"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe55c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Outer contrast shell (visible on both #ffffff and #000000) -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="#070a09" stroke="#1e2926" stroke-width="4"/>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Left Bi-Directional Scroll Track (Emerald) -->
  <path d="M 64 62 V 194" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 46 82 L 64 60 L 82 82" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 174 L 64 196 L 82 174" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Sticky Sidebar / TOC Panel (Crimson Frame) -->
  <rect x="124" y="48" width="84" height="160" rx="16" fill="#18080e" stroke="url(#crimsonGrad)" stroke-width="14"/>
  <!-- Muted TOC Items -->
  <rect x="144" y="74" width="44" height="12" rx="6" fill="#64748b"/>
  <!-- Active / Guarded TOC Item in Gold -->
  <rect x="142" y="106" width="48" height="20" rx="7" fill="url(#goldGrad)"/>
  <rect x="144" y="144" width="36" height="12" rx="6" fill="#94a3b8"/>
  <rect x="144" y="170" width="44" height="12" rx="6" fill="#64748b"/>

  <!-- Golden Tether S-Curve & Anchor Nodes (on top) -->
  <path d="M 64 128 C 94 128, 94 116, 124 116" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="64" cy="128" r="11" fill="url(#goldGrad)"/>
  <circle cx="124" cy="116" r="10" fill="url(#goldGrad)"/>
</svg>
